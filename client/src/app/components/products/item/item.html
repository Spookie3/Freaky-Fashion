<article class="item w-full text-ink" lang="en" [attr.aria-busy]="isLoading()">
  @if (isLoading()) {
    <p class="m-0 p-4 text-sm text-muted" role="status">Loading product...</p>
  } @else if (errorMessage()) {
    <p class="m-0 p-4 text-sm text-danger" role="alert">{{ errorMessage() }}</p>
  } @else if (product(); as item) {
    <a [routerLink]="['/products', productSlug(item)]" class="block text-inherit no-underline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-highlight">
    <div class="relative isolate overflow-hidden border border-outline bg-surface">
      <svg class="pointer-events-none absolute inset-0 h-full w-full text-outline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path d="M0 0 L100 100 M100 0 L0 100" fill="none" stroke="currentColor" stroke-width="1" vector-effect="non-scaling-stroke" />
      </svg>
      <img class="relative block aspect-[3/4] w-full object-contain" [src]="item.imageurl" [alt]="item.title" loading="lazy" />
      <span class="pointer-events-none absolute bottom-3 right-3 rounded-full bg-surface p-2 text-ink" aria-hidden="true">
        <svg class="heart-icon h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" />
        </svg>
      </span>
      @if (isNew(item)) {
        <span class="new-badge absolute right-3 top-3 rounded bg-accent px-3 py-1 text-sm font-medium text-white">New</span>
      }
    </div>
    <div class="grid grid-cols-[minmax(0,1fr)_auto] items-baseline gap-x-3 gap-y-1.5 pt-3">
      <h2 class="m-0 text-base font-semibold [overflow-wrap:anywhere]">{{ item.title }}</h2>
      <p class="price m-0 text-right text-sm font-semibold sm:text-base">{{ formatPrice(item.price) }}</p>
      <p class="brand col-span-2 m-0 text-sm text-muted">{{ item.brand }}</p>
    </div>
    </a>
  }
</article>
