<app-navigation></app-navigation>
<main class="mx-auto max-w-7xl px-4 py-8" lang="en" [attr.aria-busy]="state().loading">
  <app-hero class="mb-10" />
  <h1 class="mb-6 text-2xl font-semibold">Recently added products</h1>
  @if (state().loading) {
    <p role="status">Loading products...</p>
  } @else if (state().error) {
    <p role="alert">{{ state().error }}</p>
  } @else if (state().products.length === 0) {
    <p role="status">There are no products yet.</p>
  } @else {
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (product of state().products; track product.id) {
        <app-item [productId]="product.id" />
      }
    </div>
  }
</main>
<app-footer></app-footer>
